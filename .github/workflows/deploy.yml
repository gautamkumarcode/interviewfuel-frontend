name: Deploy Frontend

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Create env file inside the nested folder
      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" >> interviewfuel-frontend/.env
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> interviewfuel-frontend/.env
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> interviewfuel-frontend/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> interviewfuel-frontend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> interviewfuel-frontend/.env
          echo "OAUTH_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}" >> interviewfuel-frontend/.env
          echo "OAUTH_GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}" >> interviewfuel-frontend/.env

      # 2) Install dependencies
      - name: Install dependencies
        run: |
          cd interviewfuel-frontend
          npm install

      # 3) Build Next.js
      - name: Build Next.js
        run: |
          cd interviewfuel-frontend
          npm run build

      # 4) Verify output
      - name: Verify build output
        run: |
          cd interviewfuel-frontend
          echo "Root files:"
          ls -a
          echo ".next folder:"
          ls -a .next

      # 5) Upload build files to EC2
      - name: Upload files to EC2 using SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: |
            interviewfuel-frontend/.next
            interviewfuel-frontend/public
            interviewfuel-frontend/package.json
            interviewfuel-frontend/package-lock.json
            interviewfuel-frontend/next.config.ts
            interviewfuel-frontend/.env
          target: /home/ec2-user/interviewfuel-frontend
          overwrite: true
          debug: true

      # 6) Restart PM2 on EC2
      - name: Restart PM2 on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/interviewfuel-frontend
            npm install --omit=dev
            pm2 restart frontend || pm2 start "npm start" --name frontend
            pm2 save
