name: 🚀 Deploy Frontend

on:
  push:
    branches: [ develop ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # 🧪 BUILD NEXT.JS WITH ENV VARIABLES
      - name: Build Next.js App
        run: |
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} \
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }} \
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }} \
          npm run build

      # 📤 Upload ONLY required build files
      - name: Upload Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ".next,out,package.json,package-lock.json"
          target: "/home/ec2-user/interviewfuel-frontend"

      # 🚀 Restart PM2 Frontend
      - name: Restart Frontend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/interviewfuel-frontend
            npm install --production

            pm2 restart frontend || pm2 start "npm start" --name frontend
            pm2 save
